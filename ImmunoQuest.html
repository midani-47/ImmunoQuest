<title>ImmunoQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky command HUD on top, mission stage left, commander status rail right (stacks under the stage on phones). One committed dark "bio-ops" look. */
:root{
  color-scheme: dark;
  --abyss:#041a20; --deep:#0b3c49; --panel:#08303a; --panel-2:#0d4250; --line:#1d5f6c;
  --teal:#1b7f8c; --cyan:#5fd3e0; --green:#4c9f70; --green-hi:#7fd49c; --amber:#f2b441;
  --crimson:#ff5a74; --violet:#a596ff; --ink:#e6f4f2; --ink-2:#a9c9c8; --ink-3:#729c9d; --void:#021116;
  --font-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --font-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--abyss);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1100px 560px at 12% -8%,rgba(27,127,140,.30),transparent 60%),
  radial-gradient(800px 480px at 108% 18%,rgba(255,90,116,.09),transparent 60%),
  linear-gradient(rgba(95,211,224,.04) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,rgba(95,211,224,.04) 1px,transparent 1px) 0 0/44px 44px}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.iq-app{position:relative;z-index:1;min-height:100%}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(3,22,27,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;flex:0 1 230px}
.brand-name{font-family:var(--font-display);font-weight:700;letter-spacing:.16em;font-size:16px;color:var(--cyan);white-space:nowrap}
.brand-name sup{font-size:.5em;letter-spacing:0;margin-left:1px}
.brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;gap:14px;flex:1 1 340px;min-width:0}
.meter{flex:1 1 0;min-width:0;position:relative}
.meter-top{display:flex;justify-content:space-between;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.meter-val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.bar{height:8px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;margin-top:4px}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:50%;transition:width .7s ease}
.bar.hh>i{background:linear-gradient(90deg,var(--green),var(--green-hi))}
.bar.hh.warn>i{background:linear-gradient(90deg,#b77b17,var(--amber))}
.bar.hh.crit>i{background:linear-gradient(90deg,#a8243a,var(--crimson))}
.bar.pl>i{background:linear-gradient(90deg,#8e2a45,var(--crimson))}
.bar.pl::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35)}
.stats{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stat{font-family:var(--font-mono);font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;background:rgba(11,60,73,.55);white-space:nowrap;color:var(--ink-3);position:relative}
.stat b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:5px}
.hbtn{cursor:pointer;border-color:var(--teal);color:var(--cyan);letter-spacing:.06em;text-transform:uppercase}
.hbtn:hover{background:rgba(27,127,140,.35)}
.float{position:absolute;right:0;top:-6px;font-family:var(--font-mono);font-size:12px;font-weight:600;pointer-events:none;animation:floatUp 1.6s ease forwards;white-space:nowrap}
.float.up{color:var(--green-hi)} .float.down{color:var(--crimson)}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}

/* Main grid */
.iq-main{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:980px){.iq-main{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:981px){.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}}
.foot{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:0 28px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em}

/* Panels */
.panel{position:relative;background:linear-gradient(180deg,rgba(13,66,80,.94),rgba(7,44,53,.94));border:1px solid var(--line);border-radius:4px;padding:22px;min-width:0}
.panel::before{content:"";position:absolute;inset:-1px;pointer-events:none;border-radius:4px;opacity:.75;background:
  linear-gradient(var(--cyan),var(--cyan)) top left/16px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) top left/2px 16px no-repeat,
  linear-gradient(var(--cyan),var(--cyan)) bottom right/16px 2px no-repeat,linear-gradient(var(--cyan),var(--cyan)) bottom right/2px 16px no-repeat}
@media (max-width:560px){.panel{padding:16px}}
.side .panel{padding:16px}
.label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.kind{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kind .stepno{color:var(--ink-3)}
.ch-title{font-size:clamp(22px,3.4vw,28px);margin:6px 0 14px;color:var(--ink)}
.story{display:flex;flex-direction:column;gap:10px;max-width:70ch}
.story p{color:var(--ink)}
.prompt{font-family:var(--font-display);font-size:19px;font-weight:600;margin:18px 0 12px;color:var(--cyan);max-width:70ch}
.sub{color:var(--ink-2);font-size:14.5px}

/* Buttons */
.btn{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.07em;text-transform:uppercase;border:0;color:#03222a;background:var(--cyan);padding:11px 20px;border-radius:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--amber)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:rgba(95,211,224,.1);color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.btn.ghost:focus-visible{box-shadow:inset 0 0 0 3px var(--amber)}
.btn.amber{background:var(--amber)}
.btn.red{background:var(--crimson);color:#fff}
.btn.small{font-size:13px;padding:8px 14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.linkbtn{background:none;border:0;color:var(--ink-3);text-decoration:underline;cursor:pointer;font-size:14px;padding:6px 2px}
.linkbtn:hover{color:var(--ink)}

/* Intel */
.intel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin:16px 0 4px}
.intel-item{border:1px solid var(--line);border-left:3px solid var(--teal);background:rgba(3,22,27,.6);padding:10px 12px;border-radius:2px;min-width:0}
.intel-item.ok{border-left-color:var(--green-hi)} .intel-item.warn{border-left-color:var(--amber)} .intel-item.bad{border-left-color:var(--crimson)}
.intel-item .k{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.intel-item .v{font-size:14.5px;color:var(--ink)}
.redact{display:flex;flex-direction:column;gap:5px;margin:6px 0 10px}
.redact i{display:block;height:8px;background:repeating-linear-gradient(90deg,rgba(114,156,157,.35) 0 10px,rgba(114,156,157,.15) 10px 14px)}
.redact i:nth-child(2){width:70%}
.scanning{animation:scanPulse .5s ease}
@keyframes scanPulse{from{background:rgba(95,211,224,.35)}to{background:rgba(3,22,27,.6)}}

/* Options */
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);background:rgba(3,22,27,.62);font-size:15.5px;line-height:1.45;border-radius:3px;cursor:pointer;transition:border-color .15s,background-color .15s;position:relative}
.opt:hover:not(:disabled){border-color:var(--teal);background:rgba(27,127,140,.18)}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:rgba(95,211,224,.13);box-shadow:inset 3px 0 0 var(--cyan)}
.opt .key{flex:none;width:28px;height:28px;display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:2px;color:var(--cyan)}
.opt[aria-pressed="true"] .key{background:var(--cyan);color:#03222a;border-color:var(--cyan)}
.opt .txt{min-width:0;padding-top:2px}
.opt:disabled{cursor:default}
.opt.failed{opacity:.55}
.opt.failed .txt{text-decoration:line-through;text-decoration-color:rgba(255,90,116,.8)}
.opt.failed .key{color:var(--crimson);border-color:var(--crimson)}
.stamp{position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(-6deg);font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--crimson);border:1.5px solid var(--crimson);padding:1px 6px}
.opt.hunch{border-style:dashed;color:var(--ink-2)}
.opts.multi .key{border-radius:0}
.opts.locked .opt{cursor:default}

/* Council */
.council{border-color:rgba(242,180,65,.55);background:linear-gradient(180deg,rgba(58,44,10,.55),rgba(7,44,53,.95) 55%)}
.council::before{background:
  linear-gradient(var(--amber),var(--amber)) top left/16px 2px no-repeat,linear-gradient(var(--amber),var(--amber)) top left/2px 16px no-repeat,
  linear-gradient(var(--amber),var(--amber)) bottom right/16px 2px no-repeat,linear-gradient(var(--amber),var(--amber)) bottom right/2px 16px no-repeat}
.council-head{display:flex;gap:14px;align-items:center}
.council-head svg{flex:none;width:44px;height:44px}
.council-head h3{font-size:18px;color:var(--amber);letter-spacing:.08em;text-transform:uppercase}
.council-msg{color:var(--ink);margin-top:10px;max-width:68ch}
.tabs{display:flex;gap:6px;margin:16px 0 12px;flex-wrap:wrap}
.tab{cursor:pointer;border:1px solid var(--line);background:rgba(3,22,27,.6);padding:7px 12px;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-radius:2px}
.tab[aria-selected="true"]{border-color:var(--amber);color:var(--amber);background:rgba(242,180,65,.1)}
.just-text{width:100%;min-height:120px;background:rgba(3,22,27,.8);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:15.5px;padding:12px;border-radius:3px;resize:vertical}
.just-text:focus{outline:none;border-color:var(--amber)}
.counter{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);text-align:right;margin-top:4px}
.thinking{font-family:var(--font-mono);font-size:13px;color:var(--amber);display:flex;align-items:center;gap:10px;margin-top:12px}
.thinking i{width:8px;height:8px;background:var(--amber);border-radius:50%;animation:blink 1s steps(2) infinite}
.note{font-size:14px;color:var(--ink-2);margin-top:10px}

/* Assessment */
.verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vbadge{font-family:var(--font-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border:2px solid currentColor;font-size:15px}
.v-correct{color:var(--green-hi);background:rgba(76,159,112,.14)}
.v-partial{color:var(--amber);background:rgba(242,180,65,.1)}
.v-mis{color:var(--crimson);background:rgba(255,90,116,.1)}
.v-guess{color:var(--ink-2);border-style:dashed}
.deltas{display:flex;gap:6px;flex-wrap:wrap}
.delta{font-family:var(--font-mono);font-size:12.5px;padding:3px 8px;border-radius:2px;background:rgba(255,255,255,.07);color:var(--ink-2)}
.delta.up{color:var(--green-hi)} .delta.down{color:var(--crimson)}
.outcome{border-left:3px solid var(--teal);padding:10px 14px;background:rgba(3,22,27,.55);margin-top:14px;max-width:70ch}
.outcome.bad{border-left-color:var(--crimson)}
.outcome .label{display:block;margin-bottom:4px}
.feedback{margin-top:12px;max-width:70ch}
.feedback .label{display:block;margin-bottom:4px;color:var(--amber)}
.hintbox{border:1px dashed var(--amber);padding:10px 14px;color:#f6d38b;margin-top:12px;max-width:70ch;border-radius:2px}
.hintbox .label{color:var(--amber);display:block;margin-bottom:2px}

/* Debrief */
.debrief{border-color:rgba(127,212,156,.5)}
.debrief h3{font-size:21px;margin:4px 0 12px;color:var(--green-hi)}
.debrief .story p{color:var(--ink)}
.rewards{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.reward{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:rgba(3,22,27,.6);padding:8px 12px;border-radius:3px;cursor:pointer;text-align:left}
.reward:hover{border-color:var(--cyan)}
.reward .mini{width:56px;flex:none;border-radius:4px;overflow:hidden;background:var(--void)}
.reward .mini svg{display:block;width:100%;height:auto}
.reward b{display:block;font-family:var(--font-display);font-size:15px}
.reward span{font-family:var(--font-mono);font-size:11px;color:var(--amber);letter-spacing:.1em;text-transform:uppercase}

/* Order puzzle */
.ord{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:6px}
@media (max-width:720px){.ord{grid-template-columns:minmax(0,1fr)}}
.ord-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{display:flex;gap:10px;align-items:flex-start;min-height:48px;border:1px dashed var(--line);padding:10px 12px;border-radius:3px;text-align:left;width:100%;background:transparent;font-size:15px;line-height:1.4}
.slot .num{font-family:var(--font-mono);color:var(--cyan);width:20px;flex:none;font-weight:600}
.slot.filled{border-style:solid;background:rgba(95,211,224,.08);cursor:pointer}
.slot.filled:hover{border-color:var(--crimson)}
.slot.empty{color:var(--ink-3);cursor:default}
.slot.empty.next{border-color:var(--cyan)}
.pool-empty{font-size:14px;color:var(--ink-3);padding:8px 0}

/* Classify */
.cls{display:flex;flex-direction:column;margin-top:6px}
.cls-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(29,95,108,.6)}
.cls-row:last-child{border-bottom:0}
.cls-item{font-size:15.5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{cursor:pointer;border:1px solid var(--line);background:rgba(3,22,27,.6);padding:6px 11px;font-family:var(--font-mono);font-size:12px;border-radius:2px;color:var(--ink-2)}
.seg button:hover:not(:disabled){border-color:var(--teal)}
.seg button[aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan);color:#03222a;font-weight:600}
@media (max-width:640px){.cls-row{grid-template-columns:minmax(0,1fr)}}

/* Build */
.build{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.build h4{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:500;margin-bottom:8px}
.build .opts{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}

/* Boss */
.boss{border-color:rgba(255,90,116,.55);background:linear-gradient(180deg,rgba(60,12,24,.6),rgba(7,44,53,.95) 60%)}
.boss-head{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:520px){.boss-head{grid-template-columns:84px minmax(0,1fr)}}
.boss-art{border-radius:50%;overflow:hidden;background:var(--void);box-shadow:0 0 30px rgba(255,90,116,.35)}
.boss-art svg{display:block;width:100%;height:auto}
.boss-name{font-size:clamp(20px,3vw,26px);color:#ffd2da}
.boss .bar{height:12px}
.pips{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.pip{width:24px;height:6px;background:rgba(255,255,255,.14)}
.pip.done{background:var(--green-hi)} .pip.now{background:var(--amber)}
.tactic{margin-top:16px;border:1px solid rgba(255,90,116,.45);background:rgba(40,8,16,.45);padding:14px;border-radius:3px}
.tactic h3{font-size:18px;color:var(--crimson);margin-bottom:6px;letter-spacing:.04em}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.unit{display:flex;flex-direction:column;gap:8px;padding:8px;border:1px solid var(--line);background:rgba(3,22,27,.62);border-radius:4px;cursor:pointer;text-align:left;position:relative}
.unit:hover:not(:disabled){border-color:var(--teal)}
.unit[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(95,211,224,.25)}
.unit .uart{border-radius:3px;overflow:hidden;background:var(--void);aspect-ratio:10/7}
.unit .uart svg{display:block;width:100%;height:100%}
.unit b{font-family:var(--font-display);font-size:14.5px;display:flex;gap:6px;align-items:center}
.unit .key{font-family:var(--font-mono);font-size:11px;color:var(--cyan);border:1px solid var(--line);padding:0 5px}
.unit.failed{opacity:.5}
.unit.failed b{text-decoration:line-through;text-decoration-color:var(--crimson)}

/* Transmission */
.tx{border-color:rgba(255,90,116,.6);background:linear-gradient(180deg,rgba(52,10,22,.65),rgba(6,38,46,.96) 45%);overflow:hidden}
.tx::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
.tx::before{background:
  linear-gradient(var(--crimson),var(--crimson)) top left/16px 2px no-repeat,linear-gradient(var(--crimson),var(--crimson)) top left/2px 16px no-repeat,
  linear-gradient(var(--crimson),var(--crimson)) bottom right/16px 2px no-repeat,linear-gradient(var(--crimson),var(--crimson)) bottom right/2px 16px no-repeat}
.tx-game{font-family:var(--font-display);letter-spacing:.32em;color:var(--cyan);font-size:13px;font-weight:700}
.tx-game sup{font-size:.6em;letter-spacing:0}
.tx-mission{font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;color:var(--ink-2);margin-top:14px}
.tx h1{font-size:clamp(30px,6vw,52px);margin:4px 0 0;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.tx-alert{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);letter-spacing:.22em;color:var(--crimson);font-weight:600;font-size:14px;margin-top:22px;text-transform:uppercase}
.tx-alert .dot{width:10px;height:10px;border-radius:50%;background:var(--crimson);box-shadow:0 0 12px var(--crimson);animation:blink 1s steps(2) infinite}
.tx-from{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-top:4px;letter-spacing:.06em}
.tx-lines{font-family:var(--font-mono);font-size:15px;line-height:1.7;color:#d6efe9;margin-top:16px;display:flex;flex-direction:column;gap:8px;max-width:72ch;position:relative;z-index:1}
.caret{display:inline-block;width:8px;height:1.05em;background:var(--cyan);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(2) infinite}
.tx-readout{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.tx .actions{position:relative;z-index:1}
@keyframes blink{50%{opacity:0}}
.resume{border-color:rgba(242,180,65,.55)}

/* Report */
.report h2{font-size:clamp(24px,4vw,34px);margin:4px 0 6px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-top:16px}
.rstat{border:1px solid var(--line);padding:12px;background:rgba(3,22,27,.55);border-radius:2px;min-width:0}
.rstat .v{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.rstat .s{font-size:13px;color:var(--ink-2)}
.rsec{margin-top:20px}
.rsec h3{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:500;margin-bottom:8px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tl li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.tl .mk{font-family:var(--font-mono);font-size:11px;flex:none;width:74px;color:var(--ink-3)}
.tl .mk.good{color:var(--green-hi)} .tl .mk.mid{color:var(--amber)} .tl .mk.bad{color:var(--crimson)}
.weak{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.weak li{border-left:3px solid var(--crimson);padding:4px 10px;background:rgba(255,90,116,.06);font-size:15px}
.weak li b{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--crimson);display:block}
.gameover{border-color:var(--crimson);background:linear-gradient(180deg,rgba(80,10,26,.75),rgba(20,8,12,.95))}
.gameover h2{color:var(--crimson);font-size:clamp(26px,5vw,40px);letter-spacing:.06em}

/* Sidebar */
.side h3{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:10px}
.rankline{display:flex;align-items:center;gap:12px}
.rankline svg{width:42px;height:42px;flex:none}
.rankline b{font-family:var(--font-display);font-size:19px;display:block}
.rankline span{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.xpbar{margin-top:10px}
.cells{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.cells li{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--ink-3)}
.cells li.on{color:var(--ink)}
.check{width:17px;height:17px;border:1.5px solid var(--ink-3);display:grid;place-items:center;flex:none;font-size:12px;line-height:1;border-radius:2px}
.cells li.on .check{border-color:var(--green-hi);background:rgba(76,159,112,.3);color:var(--green-hi)}
.camp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.camp li{display:flex;gap:10px;align-items:center;font-size:14px;padding:4px 0;color:var(--ink-3)}
.camp .n{font-family:var(--font-mono);font-size:11px;width:22px;height:22px;border:1px solid var(--line);display:grid;place-items:center;flex:none;border-radius:50%}
.camp li.done{color:var(--ink-2)} .camp li.done .n{border-color:var(--green-hi);color:var(--green-hi)}
.camp li.now{color:var(--ink)} .camp li.now .n{border-color:var(--amber);color:#03222a;background:var(--amber)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:12px;color:var(--ink-2);max-height:220px;overflow:auto}
.log li.up{color:var(--green-hi)} .log li.down{color:#ff9aaa} .log li.gold{color:var(--amber)}

/* Modals */
.modal-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;background:rgba(2,12,15,.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto}
.modal{width:100%;max-width:760px;margin:auto 0}
.modal .panel{padding:20px}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.xbtn{cursor:pointer;border:1px solid var(--line);background:rgba(3,22,27,.6);width:36px;height:36px;display:grid;place-items:center;font-size:18px;border-radius:2px;color:var(--ink-2)}
.reveal{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.reveal-info{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:12px}
.reveal-info .label{color:var(--amber)}
.unlock-banner{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#03222a;background:var(--green-hi);padding:6px 10px;display:inline-block;font-weight:600}
.vault{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-list .btn{width:100%}

/* Immune cards */
.icard{--c1:#1b7f8c;--c2:#0b3c49;width:270px;max-width:100%;border-radius:12px;padding:9px;background:linear-gradient(155deg,var(--c1),var(--c2) 70%);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.18);color:var(--ink);flex:none}
.icard.anim{animation:cardIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{0%{opacity:0;transform:perspective(800px) rotateY(80deg) scale(.85)}100%{opacity:1;transform:none}}
.icard-in{background:rgba(2,16,20,.9);border-radius:7px;padding:10px;display:flex;flex-direction:column;gap:8px;height:100%}
.icard-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.icard-name{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.1}
.icard-rar{font-family:var(--font-mono);font-size:10px;color:var(--amber);white-space:nowrap}
.icard-type{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--c1)}
.icard-art{border-radius:5px;overflow:hidden;background:var(--void);aspect-ratio:10/7;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.icard-art svg{display:block;width:100%;height:100%}
.icard-ab{border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:7px 9px;font-size:13px;line-height:1.4}
.icard-ab b{display:block;font-family:var(--font-display);color:var(--amber);font-size:13.5px}
.icard-stats{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);gap:6px}
.icard.sm{width:100%;padding:6px;border-radius:9px;cursor:pointer}
.icard.sm .icard-in{padding:7px;gap:6px}
.icard.sm .icard-name{font-size:14px}
.icard.locked{--c1:#2a3d42;--c2:#132226;cursor:default}
.icard.locked .icard-art{display:grid;place-items:center;font-family:var(--font-display);font-size:30px;color:#2f4a50}
.t-barrier{--c1:#e0a43a;--c2:#5a3a0c} .t-innate{--c1:#2fb3c2;--c2:#0b3c49} .t-adaptive{--c1:#9d8cff;--c2:#2b2366}
.t-molecule{--c1:#e7c35a;--c2:#4a3a10} .t-cytokine{--c1:#f0709a;--c2:#4a1528} .t-tech{--c1:#62e0b0;--c2:#0f3c33} .t-regulatory{--c1:#7fd49c;--c2:#143a26}

/* Toasts */
.toasts{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{background:rgba(3,22,27,.96);border:1px solid var(--amber);padding:10px 14px;border-radius:3px;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:toastIn .35s ease}
.toast b{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.bonus-tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:#03222a;background:var(--violet);padding:2px 8px;font-weight:600}
.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.flash-good{animation:flashGood .9s ease}
@keyframes flashGood{0%{box-shadow:0 0 0 0 rgba(127,212,156,.0)}30%{box-shadow:0 0 0 4px rgba(127,212,156,.45)}100%{box-shadow:0 0 0 0 rgba(127,212,156,0)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.panel{scroll-margin-top:150px}.bar.hpb>i{background:linear-gradient(90deg,#8e2a45,var(--crimson))}.chart{margin:14px 0;border:1px solid var(--line);background:rgba(3,22,27,.6);padding:8px;border-radius:3px;overflow-x:auto}.chart svg{display:block;width:100%;min-width:300px;height:auto}
</style>

<script>
/* ImmunoQuest: immune cards and artwork */
window.IQ = window.IQ || {};
(function (IQ) {
  'use strict';
  let uid = 0;
  const f = (n) => Number(n).toFixed(1);
  function wrap(u, c1, c2, inner, vb) {
    return '<svg viewBox="' + (vb || '0 0 200 140') + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid slice">' +
      '<defs><radialGradient id="' + u + 'bg" cx="50%" cy="42%" r="78%"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></radialGradient></defs>' +
      '<rect width="200" height="' + (vb ? 200 : 140) + '" fill="url(#' + u + 'bg)"/>' + inner + '</svg>';
  }
  function rng(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
  function motes(seed, color, n, h) {
    const r = rng(seed); let s = '';
    for (let i = 0; i < n; i++) s += '<circle cx="' + f(r() * 200) + '" cy="' + f(r() * (h || 140)) + '" r="' + f(0.6 + r() * 1.6) + '" fill="' + color + '" opacity="' + f(0.15 + r() * 0.4) + '"/>';
    return s;
  }
  function virus(x, y, r, c, core) {
    let s = '';
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5, x1 = x + Math.cos(a) * r, y1 = y + Math.sin(a) * r, x2 = x + Math.cos(a) * r * 1.5, y2 = y + Math.sin(a) * r * 1.5;
      s += '<line x1="' + f(x1) + '" y1="' + f(y1) + '" x2="' + f(x2) + '" y2="' + f(y2) + '" stroke="' + c + '" stroke-width="' + f(r * 0.16) + '"/><circle cx="' + f(x2) + '" cy="' + f(y2) + '" r="' + f(r * 0.2) + '" fill="' + c + '"/>';
    }
    return s + '<circle cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(r) + '" fill="' + (core || '#5a0f24') + '" stroke="' + c + '" stroke-width="' + f(r * 0.14) + '"/>';
  }
  function lymph(u, x, y, r, c1, c2, nuc) {
    return '<defs><radialGradient id="' + u + 'c" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></radialGradient></defs>' +
      '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="url(#' + u + 'c)" stroke="' + c1 + '" stroke-width="1.5"/>' +
      '<circle cx="' + (x + r * 0.06) + '" cy="' + (y + r * 0.04) + '" r="' + f(r * 0.74) + '" fill="' + nuc + '" opacity=".92"/>';
  }
  function yRec(x, y, a, len, c) {
    const ca = Math.cos(a), sa = Math.sin(a), x2 = x + ca * len, y2 = y + sa * len;
    const l = a - 0.55, rr = a + 0.55, al = len * 0.7;
    return '<path d="M' + f(x) + ',' + f(y) + ' L' + f(x2) + ',' + f(y2) + ' M' + f(x2) + ',' + f(y2) + ' L' + f(x2 + Math.cos(l) * al) + ',' + f(y2 + Math.sin(l) * al) + ' M' + f(x2) + ',' + f(y2) + ' L' + f(x2 + Math.cos(rr) * al) + ',' + f(y2 + Math.sin(rr) * al) + '" stroke="' + c + '" stroke-width="2.2" stroke-linecap="round" fill="none"/>';
  }

  const ART = {
    skin(u) {
      let s = motes(3, '#ffd08a', 18);

      s += '<path d="M40,24 q-10,-14 -22,-6 M120,18 q8,-14 20,-6" stroke="#ff9aaa" stroke-dasharray="3 3" fill="none"/>';

      for (let i = 0; i < 7; i++) s += '<rect x="' + (i * 32 + 6) + '" y="44" width="34" height="9" rx="4" fill="#ddb06a" stroke="#8a6424" stroke-width=".8"/>';
      for (let i = 0; i < 8; i++) s += '<circle cx="' + (i * 27 + 8) + '" cy="68" r="11" fill="#c98a4a" stroke="#7a4e1e"/><circle cx="' + (i * 27 + 8) + '" cy="68" r="4" fill="#5a3410"/>';
      for (let i = 0; i < 10; i++) s += '<rect x="' + (i * 21 - 2) + '" y="82" width="19" height="18" rx="3" fill="#b5713a" stroke="#6e4012"/><circle cx="' + (i * 21 + 7.5) + '" cy="91" r="3.5" fill="#4a2a0a"/>';
      s += '<path d="M0,104 Q25,98 50,104 T100,104 T150,104 T200,104 V140 H0 Z" fill="#5a2220"/><path d="M0,124 C40,112 80,134 120,120 S180,116 200,126" stroke="#ff5a74" stroke-width="6" fill="none" opacity=".75"/>';
      return wrap(u, '#4a3514', '#120b04', s);
    },
    mucus(u) {
      let s = motes(5, '#9ff0f7', 14);
      s += '<path d="M0,40 C30,30 60,48 100,38 S170,30 200,40 V70 H0 Z" fill="#7fd49c" opacity=".32"/>';
      s += virus(42, 54, 4, '#ff5a74') + virus(96, 50, 5, '#ff5a74') + virus(150, 56, 4, '#ff5a74');
      for (let i = 0; i < 6; i++) {

    },
    macrophage(u) {
      let s = motes(7, '#5fd3e0', 16);
      s += '<defs><radialGradient id="' + u + 'm" cx="40%" cy="40%" r="70%"><stop offset="0" stop-color="#3fc4d1"/><stop offset="1" stop-color="#0e5560"/></radialGradient></defs>';
      s += '<path d="M40,70 C28,42 68,20 98,30 C122,16 158,28 162,52 C186,60 184,94 158,102 C148,126 108,126 94,112 C68,126 36,112 42,92 C24,88 26,74 40,70 Z" fill="url(#' + u + 'm)" stroke="#9ff0f7" stroke-width="2"/>';

      s += '<g transform="rotate(-22 160 50)"><rect x="140" y="42" width="44" height="16" rx="8" fill="#e7c35a" stroke="#8a6c14"/><path d="M146,50 h32" stroke="#8a6c14" stroke-dasharray="3 3"/></g>';
      s += '<path d="M146,34 C164,22 196,32 190,58" stroke="#3fc4d1" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85"/>';
      s += '<circle cx="124" cy="86" r="6" fill="#e7c35a" opacity=".55"/><circle cx="62" cy="96" r="4" fill="#e7c35a" opacity=".5"/><circle cx="134" cy="66" r="3.5" fill="#e7c35a" opacity=".5"/>';

    },
    neutrophil(u) {

      s += '<path d="M128,74 L150,52 L166,78 L186,58 M140,96 L162,86 L176,108 L198,92" stroke="#e7c35a" stroke-width="1.4" fill="none" opacity=".8"/>';
      s += '<rect x="156" y="46" width="16" height="7" rx="3.5" fill="#e7c35a" transform="rotate(30 164 50)"/><rect x="172" y="96" width="16" height="7" rx="3.5" fill="#e7c35a"/>';

      const r = rng(4); for (let i = 0; i < 22; i++) { const a = r() * 6.28, d = 14 + r() * 26; s += '<circle cx="' + f(82 + Math.cos(a) * d) + '" cy="' + f(72 + Math.sin(a) * d) + '" r="1.6" fill="#fff0fb" opacity=".8"/>'; }
      return wrap(u, '#3a1d3d', '#120714', s);
    },
    nk(u) {
      let s = motes(11, '#ff9aaa', 14);
      s += '<circle cx="152" cy="72" r="32" fill="#36494f" stroke="#ff5a74" stroke-width="2" stroke-dasharray="5 4"/><circle cx="154" cy="74" r="13" fill="#1d2a2e"/>';
      s += '<g stroke="#ff5a74" stroke-width="1.5" fill="none"><rect x="168" y="44" width="9" height="6" stroke-dasharray="2 2"/><rect x="176" y="86" width="9" height="6" stroke-dasharray="2 2"/><rect x="140" y="98" width="9" height="6" stroke-dasharray="2 2"/></g>';
      s += '<path d="M174,58 l6,-4 M168,104 l5,4" stroke="#f2b441" stroke-width="2"/>';
      s += lymph(u, 72, 72, 40, '#5fe0cf', '#0d5a5f', '#083238');
      const r = rng(8); for (let i = 0; i < 16; i++) { const a = r() * 6.28, d = 8 + r() * 22; s += '<circle cx="' + f(72 + Math.cos(a) * d) + '" cy="' + f(72 + Math.sin(a) * d) + '" r="2.4" fill="#ff5a74"/>'; }
      s += '<polygon points="116,72 106,62 118,66 116,52 124,64 134,58 126,72 136,84 124,80 120,94 116,80 104,84" fill="#f2b441"/>';
      return wrap(u, '#2a1220', '#0a0408', s);
    },
    interferon(u) {
      let s = motes(13, '#f0709a', 14);
      [34, 50, 66].forEach((r, i) => { s += '<circle cx="100" cy="70" r="' + r + '" fill="none" stroke="#f0709a" stroke-width="2" stroke-dasharray="6 6" opacity="' + (0.8 - i * 0.22) + '"/>'; });
      s += '<circle cx="100" cy="70" r="22" fill="#c4456f" stroke="#ffb3c8" stroke-width="2"/>' + virus(100, 70, 6, '#ffd2dc', '#7a1d3c');
      [[26, 26], [174, 26], [26, 114], [174, 114]].forEach(([x, y]) => {
        s += '<circle cx="' + x + '" cy="' + y + '" r="16" fill="#235760" stroke="#5fd3e0" stroke-opacity=".6"/>';
        s += '<polygon points="' + [0, 1, 2, 3, 4, 5].map(k => f(x + Math.cos(k * Math.PI / 3) * 21) + ',' + f(y + Math.sin(k * Math.PI / 3) * 21)).join(' ') + '" fill="none" stroke="#7fd49c" stroke-width="2"/>';
      });
      return wrap(u, '#3a0f22', '#0e040a', s);

<script>

(function (IQ) {

let S = null;
const T = { typing: false, typeTimer: null, revealQ: [], modal: null, aiCtl: null, scrollTo: null, menuConfirm: null };

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; }

function fresh() {

}
function mission() { return MISSIONS[S.mi]; }
function step() { const m = mission(); return m ? m.steps[S.si] : null; }
function rankIdx(xp) { let k = 0; RANKS.forEach((r, i) => { if (xp >= r[0]) k = i; }); return k; }

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }

function mlog() {

}
function logLine(t, c) { S.log.unshift({ t: t, c: c || '' }); if (S.log.length > 40) S.log.length = 40; }
function maxKs() {

function newCur(st) {

function reasonSet(st) {

}
function reasonByKey(st, k) { return k === 'h' ? HUNCH : reasonSet(st)[k]; }
function startJustify() {

function actionStatus(st, c) {

function addWeak(tag, st) {

function blankRes() { return { cls: '', xp: 0, ks: 0, dhh: 0, dpl: 0, lead: '', fb: '', optFb: [], out: '', outBad: false, hint: '', next: '', ai: false, quality: null, just: '', firstClean: false }; }

/* Core judgement: combines the decision with the quality of the reasoning. rq is sci | part | mis | guess */
function evaluate(rq, ai) {

    if (S.phase === 'step' || S.phase === 'report' || S.phase === 'over') h += '<button type="button" class="btn ghost" data-act="askRestart">Restart this mission</button>';
    h += '<button type="button" class="btn ghost" data-act="askNew">Start a new campaign</button></div>';
  }
  return h + '</div>';
}

/* Input */
function act(a, d) {
  const c = S.cur, st = step();
  switch (a) {
    case 'begin': if (T.typing) finishTyping(); T.typedMi = S.mi; beginMission(); break;
    case 'skipTx': finishTyping(); return;
    case 'scan': { const i = +d.i; if (c.scanned.indexOf(i) < 0) c.scanned.push(i); c.justScanned = i; if (c.scanned.length === st.intel.length) T.scrollTo = null; break; }
    case 'pick': {
      if (c.stage !== 'decide') return;
      if (st.type === 'multi') { const i = c.sel.indexOf(d.k); if (i >= 0) c.sel.splice(i, 1); else c.sel.push(d.k); } else c.sel = [d.k];
      break;
    }
    case 'slot': if (c.stage === 'decide') c.build[+d.s] = d.k; break;
    case 'lock':
      if (c.stage !== 'decide') return;
      if (st.type === 'build' ? Object.keys(c.build).length < st.slots.length : !c.sel.length) return;
      c.follow = ''; startJustify(); break;
    case 'ordAdd': if (c.stage === 'decide' && c.ord.indexOf(+d.i) < 0) c.ord.push(+d.i); break;
    case 'ordRemove': if (c.stage === 'decide') c.ord.splice(+d.s, 1); break;
    case 'ordClear': if (c.stage === 'decide') c.ord = []; break;
    case 'cls': if (c.stage === 'decide') c.cls[+d.i] = +d.c; break;
    case 'submitPuzzle': c.just = ''; finishJudgement(evalPuzzle()); return;
    case 'tab': c.tab = d.t === 'write' ? 'write' : 'pick'; c.note = ''; break;
    case 'reason': c.rs = d.k === 'h' ? 'h' : +d.k; break;
    case 'submitReason': { if (c.rs == null) return; const r = reasonByKey(st, c.rs); c.just = r.t; finishJudgement(evaluate(r.q, null)); return; }
    case 'askAI': { const ta = document.getElementById('just-text'); if (ta) c.text = ta.value; askCouncil(); return; }
    case 'stopAI': if (T.aiCtl) T.aiCtl.abort(); return;
    case 'rejustify':
      if (c.rs != null && c.rDis.indexOf(c.rs) < 0) c.rDis.push(c.rs);
      if (c.res && c.res.cls === 'guess' && c.rDis.indexOf('h') < 0) c.rDis.push('h');
      c.follow = c.res && c.res.cls === 'partial' ? c.res.fb : '';
      c.res = null; startJustify(); break;
    case 'retry':
      c.attempt++; c.stage = 'decide'; c.rDis = []; c.follow = ''; c.res = null; c.rs = null;
      if (st.type === 'choice' || st.type === 'boss') {
        if (c.sel[0] && c.failed.indexOf(c.sel[0]) < 0) c.failed.push(c.sel[0]);
        c.sel = []; c.oOrder = shuffle((st.type === 'boss' ? st.rounds[c.round].options : st.options).map(optKey));
      } else if (st.type === 'multi') c.oOrder = shuffle(st.options.map(optKey));
      else if (st.type === 'build') c.sOrder = st.slots.map(s => shuffle(s.opts.map(o => o.id)));
      T.scrollTo = 'decision'; break;
    case 'toWhy': c.why = true; c.rDis = []; c.follow = ''; c.res = null; startJustify(); break;
    case 'toDebrief': case 'bossdone': completeStep(); break;
    case 'round':
      c.round++; c.sel = []; c.failed = []; c.attempt = 1; c.clean = true; c.aw = {}; c.rDis = []; c.res = null; c.follow = ''; c.rs = null; c.text = '';
      c.stage = 'decide'; c.oOrder = shuffle(st.rounds[c.round].options.map(optKey)); T.scrollTo = 'decision'; break;
    case 'next': nextStep(); break;
    case 'skipBonus': mlog().events.push({ t: st.title, k: 'skipped' }); logLine('Hidden discovery skipped', ''); nextStep(); break;
    case 'nextMission': nextMission(); break;
    case 'restartMission': restartMission(); T.typedMi = -1; break;
    case 'playAgain': newGame(); T.typedMi = -1; break;
    case 'vault': openModal(vaultHtml()); return;
    case 'menu': T.menuConfirm = null; openModal(menuHtml()); return;
    case 'card': openModal(cardReveal(d.id, false)); return;
    case 'closeModal': closeModal(); return;
    case 'toggleAI': S.aiOn = !S.aiOn; save(); openModal(menuHtml()); render(); return;
    case 'askRestart': T.menuConfirm = 'restart'; openModal(menuHtml()); return;
    case 'askNew': T.menuConfirm = 'new'; openModal(menuHtml()); return;
    case 'confirmNo': T.menuConfirm = null; openModal(menuHtml()); return;
    case 'confirmYes': {
      const w = T.menuConfirm; T.menuConfirm = null; T.revealQ = []; closeModal();
      if (T.aiCtl) T.aiCtl.abort();
      if (T.typing) { T.typing = false; clearTimeout(T.typeTimer); }
      if (w === 'new') newGame(); else restartMission();
      T.typedMi = -1; break;
    }
    default: return;
  }
  save(); render();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (T.typing && e.target.closest('#tx')) finishTyping(); return; }
  if (b.disabled) return;
  act(b.dataset.act, b.dataset);
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'just-text' && S && S.cur) {
    S.cur.text = e.target.value;
    const cnt = document.getElementById('just-count'); if (cnt) cnt.textContent = e.target.value.length + ' / 700';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && T.modal) closeModal(); });
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* Boot */
function boot(data) {
  S = data && data.S && data.S.v === 1 ? data.S : load();
  if (!S) { S = fresh(); checkpoint(); }
  else if (S.mi > 0 || S.phase !== 'intro') setTimeout(() => toast('Campaign restored', 'Welcome back, Commander. The menu lets you start over.'), 500);
  if (S.cur) { S.cur.busy = false; if (S.cur.stage === 'assess' && !S.cur.res) S.cur.stage = 'decide'; }
  initAI();
  render();
}
try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => ({ S: S })); } catch (e) { /* no hot reload */ }
const HOT = window.claude && window.claude.hot;
if (HOT && typeof HOT.ready === 'function') HOT.ready(boot); else boot((HOT && HOT.data) || {});
IQ._debug = { get S() { return S; }, act: act, render: render };
})(window.IQ);
</script>
